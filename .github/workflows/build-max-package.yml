name: Build & Package Max external

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maxforge-package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build TypeScript
        run: npm run build

      - name: Type-check tests
        run: npm run typecheck:tests

      - name: Validate Markdown links
        run: npm run docs:check

      - name: Test with coverage gate
        run: npm run test:coverage

      - name: Test installed npm package
        run: npm run test:package

      - name: Validate Max package sources
        run: python3 scripts/verify-max-package.py --source .

      - name: Stage public schemas
        run: |
          mkdir -p site/schema
          cp schema/*.json site/schema/

      - name: Validate GitHub Pages site
        run: python3 scripts/verify-pages.py site

      - name: Validate GitHub Pages JavaScript
        run: node --check site/main.js

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          ssh-key: ${{ secrets.BBB_AGENT_DEPLOY_KEY }}

      - name: Require bbb.agent deploy key
        shell: bash
        env:
          BBB_AGENT_DEPLOY_KEY: ${{ secrets.BBB_AGENT_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${BBB_AGENT_DEPLOY_KEY:-}" ]]; then
            echo "::error::BBB_AGENT_DEPLOY_KEY is required to read the private deps/bbb.agent submodule"
            exit 1
          fi

      - name: Initialize build submodules
        shell: bash
        run: |
          set -euo pipefail
          git -C deps/min-api submodule update --init --recursive
          git -C deps/bbb.agent submodule update --init deps/IXWebSocket

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DMAXFORGE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test native protocol
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Verify macOS external
        shell: bash
        run: |
          set -euo pipefail
          bundle="externals/maxforge.sync.mxo"
          binary="$bundle/Contents/MacOS/maxforge.sync"
          test -d "$bundle"
          test -x "$binary"
          lipo "$binary" -verify_arch x86_64 arm64
          test "$(plutil -extract CFBundleIdentifier raw "$bundle/Contents/Info.plist")" = "jp.2bit.maxforge.sync"
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          test "$(plutil -extract CFBundleShortVersionString raw "$bundle/Contents/Info.plist")" = "$version"
          codesign --verify --deep --strict --verbose=2 "$bundle"

      - name: Sign macOS external
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: .github/scripts/macos-direct-distribution.sh sign externals

      - name: Archive macOS external
        shell: bash
        run: .github/scripts/macos-direct-distribution.sh archive externals "$RUNNER_TEMP/macos-externals.zip"

      - name: Upload macOS external
        uses: actions/upload-artifact@v7
        with:
          name: maxforge-macos
          path: ${{ runner.temp }}/macos-externals.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          ssh-key: ${{ secrets.BBB_AGENT_DEPLOY_KEY }}

      - name: Require bbb.agent deploy key
        shell: bash
        env:
          BBB_AGENT_DEPLOY_KEY: ${{ secrets.BBB_AGENT_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${BBB_AGENT_DEPLOY_KEY:-}" ]]; then
            echo "::error::BBB_AGENT_DEPLOY_KEY is required to read the private deps/bbb.agent submodule"
            exit 1
          fi

      - name: Initialize build submodules
        shell: bash
        run: |
          set -euo pipefail
          git -C deps/min-api submodule update --init --recursive
          git -C deps/bbb.agent submodule update --init deps/IXWebSocket

      - name: Configure
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DMAXFORGE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test native protocol
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Verify Windows external
        shell: pwsh
        run: |
          $external = "externals/maxforge.sync.mxe64"
          if (-not (Test-Path -PathType Leaf $external)) {
            throw "Missing Windows external: $external"
          }
          if ((Get-Item $external).Length -eq 0) {
            throw "Windows external is empty: $external"
          }

      - name: Upload Windows external
        uses: actions/upload-artifact@v7
        with:
          name: maxforge-windows
          path: externals/
          if-no-files-found: error

  package:
    permissions:
      contents: write
    needs: [validate, build-macos, build-windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download macOS external
        uses: actions/download-artifact@v8
        with:
          name: maxforge-macos
          path: ${{ runner.temp }}/macos-artifact

      - name: Restore signed macOS external
        shell: bash
        run: .github/scripts/macos-direct-distribution.sh extract "$RUNNER_TEMP/macos-artifact/macos-externals.zip" dist/maxforge

      - name: Download Windows external
        uses: actions/download-artifact@v8
        with:
          name: maxforge-windows
          path: dist/maxforge/externals

      - name: Assemble Max package
        shell: bash
        run: scripts/assemble-max-package.sh dist/maxforge

      - name: Verify Max package
        run: python3 scripts/verify-max-package.py --package dist/maxforge

      - name: Resolve versioned archive name
        id: package-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          archive="maxforge-v${version}.zip"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_EVENT_NAME}" == "release" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package version v${version}"
            exit 1
          fi

      - name: Create macOS-preserving archive
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.package-version.outputs.archive }}
        run: |
          set -euo pipefail
          cd dist
          ditto -c -k --keepParent maxforge "$ARCHIVE_NAME"

      - name: Verify archive
        env:
          ARCHIVE_NAME: ${{ steps.package-version.outputs.archive }}
        run: python3 scripts/verify-max-package.py --archive "dist/$ARCHIVE_NAME"

      - name: Notarize and verify public archive
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.package-version.outputs.archive }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
        run: .github/scripts/macos-direct-distribution.sh notarize-and-verify "dist/$ARCHIVE_NAME" maxforge

      - name: Generate archive checksum
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.package-version.outputs.archive }}
        run: .github/scripts/macos-direct-distribution.sh checksum "dist/$ARCHIVE_NAME"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: maxforge-package-${{ steps.package-version.outputs.version }}
          path: |
            dist/${{ steps.package-version.outputs.archive }}
            dist/${{ steps.package-version.outputs.archive }}.sha256
          if-no-files-found: error

      - name: Upload to versioned release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ steps.package-version.outputs.archive }}
            dist/${{ steps.package-version.outputs.archive }}.sha256
          fail_on_unmatched_files: true
